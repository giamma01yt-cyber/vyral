name: Aggiorna statistiche

on:
  schedule:
    - cron: "*/30 * * * *"   # ogni 30 minuti
  workflow_dispatch:          # tasto "Aggiorna" dell'app

permissions:
  contents: write

concurrency:
  group: vyral-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa yt-dlp (ultima versione)
        run: pip install -U yt-dlp
      - name: Scarica statistiche
        run: python fetcher/vyral_core.py data
      - name: Salva nel repository
        run: |
          git config user.name "vyral-bot"
          git config user.email "vyral-bot@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Statistiche aggiornate [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done
